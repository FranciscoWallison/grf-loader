name: release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ───── LINT ────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn --frozen-lockfile
      - run: yarn lint

  # ───── BUILD ──────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn --frozen-lockfile
      - run: yarn build
      - run: |
          echo "::group::dist contents"
          ls -la dist/
          echo "::endgroup::"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ───── TESTES NODE ────────────────────────────────
  test-node:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: yarn --frozen-lockfile
      - run: yarn test:node

  # ───── TESTES BROWSER ─────────────────────────────
  test-browser:
    runs-on: ubuntu-latest
    needs: test-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: yarn --frozen-lockfile
      - run: yarn test:browser

  # ───── RELEASE (bump + tag + publish) ─────────────
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test-node, test-browser]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: yarn

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - run: yarn --frozen-lockfile

      - name: Check dist contents
        run: ls -la dist/

      # Not a gate: npm whoami is only here to name the account in the log. A granular token may be
      # allowed to publish and still not answer it, so a failure is a warning, not a stop.
      - name: Who does npm think we are
        run: |
          if user=$(npm whoami 2>/dev/null); then
            echo "npm user: $user"
          else
            echo "::warning::npm whoami did not answer. If the publish fails with a 404, the NPM_TOKEN secret is the first thing to look at."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Is there a version to release?
        id: release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@chicowall/grf-loader@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION is already on npm, so there is nothing to publish. Set the version in package.json to release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Releasing $VERSION"
          fi

      - name: Publish to npm
        id: publish
        if: steps.release.outputs.publish == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Why the publish failed
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          echo "::error::npm refused the publish. A 404 on the PUT means the NPM_TOKEN secret is missing, expired or cannot write to @chicowall/grf-loader -- create a token at npmjs.com (Access Tokens) and set the secret. Nothing was tagged, so a re-run of this job publishes the same version."

      # Only once the version is on npm, so a failed publish leaves no tag behind -- v1.1.1 and v1.1.2 are
      # tags of releases that never made it to the registry.
      - name: Tag the release
        if: steps.publish.outcome == 'success'
        run: |
          git tag -a "v${{ steps.release.outputs.version }}" -m "v${{ steps.release.outputs.version }}" || true
          git push --follow-tags